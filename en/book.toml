[book]
title = "Computational Neuroscience & Machine Learning"
authors = ["Neuromatch Academy"]
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
theme = "theme"
site-url = "/MachineLearningLectures/en/"

[preprocessor.katex]
command = "mdbook-katex"

[output.html.playground]
editable = true
line-numbers = true
