<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" version="1.1"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" /></marker></defs><rect width="1200" height="480" fill="#FFFFFF" /><text x="600" y="38" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle">Q-learning: target uses the largest Q value in the next state</text><text x="600" y="68" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Behavior may explore; the update target is always greedy (off-policy).</text><rect x="55" y="145" width="220" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" /><text x="165.0" y="184.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">State A</text><text x="165.0" y="209.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Action: Left</text><rect x="430" y="145" width="220" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" /><text x="540.0" y="197.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">State B</text><rect x="925" y="145" width="220" height="90" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6" /><text x="1035.0" y="196.65" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Update Q(A, Left)</text><line x1="275" y1="190" x2="425" y2="190" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)" /><text x="350" y="166" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">r = 0</text><rect x="385" y="286" width="145" height="70" rx="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.6" /><text x="457.5" y="316.40999999999997" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Forward</text><text x="457.5" y="337.65999999999997" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Q = 5</text><rect x="552" y="286" width="145" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" /><text x="624.5" y="316.40999999999997" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Explore</text><text x="624.5" y="337.65999999999997" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Q = 1</text><text x="518" y="397" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">maxₐ Q(B, a) = 5</text><line x1="650" y1="190" x2="920" y2="190" stroke="#D97706" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="7 6" /><text x="785" y="165" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Take the maximum, not the actual next action</text><text x="1035" y="182" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Target = 0 + 0.9 × 5 = 4.5</text><text x="1035" y="211" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q ← Q + α(Target − Q)</text><text x="600" y="450" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Only Q(sₜ, aₜ) is updated, but the target assumes optimal actions from sₜ₊₁ onward.</text></svg>