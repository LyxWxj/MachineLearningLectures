<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" version="1.1"><rect width="960" height="470" fill="#FFFFFF" /><text x="480" y="34" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Experiment 3: Superposition</text><text x="480" y="58" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">When representation dimensions are scarce, several sparse features can share non-orthogonal directions</text><circle cx="480" cy="225" r="130" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" /><line x1="330" y1="225" x2="630" y2="225" stroke="#94A3B8" stroke-width="1.2" /><line x1="480" y1="75" x2="480" y2="375" stroke="#94A3B8" stroke-width="1.2" /><text x="636" y="230" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start">hidden dim 1</text><text x="490" y="69" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">hidden dim 2</text><line x1="452.9047476928372" y1="333.6731213429116" x2="507.0952523071628" y2="116.3268786570884" stroke="#2563EB" stroke-width="3.5" /><text x="516.2882843399502" y="83.45564105860052" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 1</text><line x1="373.4816701749428" y1="259.60990336999413" x2="586.5183298250572" y2="190.3900966300059" stroke="#DC2626" stroke-width="3.5" /><text x="622.658477444273" y="182.6474508437579" fill="#DC2626" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 2</text><line x1="394.2030223706745" y1="153.0077877151076" x2="565.7969776293255" y2="296.9922122848924" stroke="#D97706" stroke-width="3.5" /><text x="594.9066664678467" y="325.4181414529809" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 3</text><line x1="503.286109371589" y1="115.44746871781376" x2="456.713890628411" y2="334.55253128218624" stroke="#16A34A" stroke-width="3.5" /><text x="448.81324637733616" y="375.7221401100709" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 4</text><line x1="587.6613099450917" y1="194.12861614849604" x2="372.3386900549083" y2="255.87138385150396" stroke="#7C3AED" stroke-width="3.5" /><text x="335.8107456092522" y="270.34560337254993" fill="#7C3AED" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 5</text><line x1="563.2322204534681" y1="299.9426279121921" x2="396.76777954653187" y2="150.0573720878079" stroke="#0891B2" stroke-width="3.5" /><text x="368.52827617839085" y="128.63040904617128" fill="#0891B2" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Feature 6</text><circle cx="480" cy="225" r="6" fill="#0F172A" /><text x="480" y="403" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">6 sparse features encoded in a 2-dimensional hidden representation</text><text x="480" y="433" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Principle: a coordinate is not necessarily one concept; meaning can be distributed and directions shared.</text></svg>