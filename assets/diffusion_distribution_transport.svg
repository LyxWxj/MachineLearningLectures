<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" version="1.1"><rect width="1180" height="420" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker></defs><text x="590" y="34" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Diffusion as Distribution Transport</text><text x="590" y="59" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Forward noising moves data toward simple noise; generation learns the reverse transport</text><ellipse cx="150" cy="205" rx="52" ry="112" fill="#2563EB" opacity="0.16" stroke="#2563EB" stroke-width="2.5" transform="rotate(-22 150 205)" /><ellipse cx="150" cy="205" rx="34.32" ry="73.92" fill="none" stroke="#2563EB" opacity="0.7" stroke-width="1.6" transform="rotate(-22 150 205)" /><text x="150" y="345" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Data distribution</text><text x="150" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">t = 0</text><line x1="216" y1="205" x2="324" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="390" cy="205" rx="48" ry="90" fill="#4F81BD" opacity="0.16" stroke="#4F81BD" stroke-width="2.5" transform="rotate(-12 390 205)" /><ellipse cx="390" cy="205" rx="31.68" ry="59.400000000000006" fill="none" stroke="#4F81BD" opacity="0.7" stroke-width="1.6" transform="rotate(-12 390 205)" /><text x="390" y="323" fill="#4F81BD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Noisy distribution</text><text x="390" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">t = 0.25</text><line x1="456" y1="205" x2="564" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="630" cy="205" rx="46" ry="73" fill="#64748B" opacity="0.16" stroke="#64748B" stroke-width="2.5" transform="rotate(-5 630 205)" /><ellipse cx="630" cy="205" rx="30.360000000000003" ry="48.18" fill="none" stroke="#64748B" opacity="0.7" stroke-width="1.6" transform="rotate(-5 630 205)" /><text x="630" y="306" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Intermediate</text><text x="630" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">t = 0.5</text><line x1="696" y1="205" x2="804" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="870" cy="205" rx="44" ry="61" fill="#D97706" opacity="0.16" stroke="#D97706" stroke-width="2.5" transform="rotate(0 870 205)" /><ellipse cx="870" cy="205" rx="29.040000000000003" ry="40.260000000000005" fill="none" stroke="#D97706" opacity="0.7" stroke-width="1.6" transform="rotate(0 870 205)" /><text x="870" y="294" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Almost noise</text><text x="870" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">t = 0.75</text><line x1="936" y1="205" x2="984" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" /><ellipse cx="1050" cy="205" rx="56" ry="56" fill="#DC2626" opacity="0.16" stroke="#DC2626" stroke-width="2.5" transform="rotate(0 1050 205)" /><ellipse cx="1050" cy="205" rx="36.96" ry="36.96" fill="none" stroke="#DC2626" opacity="0.7" stroke-width="1.6" transform="rotate(0 1050 205)" /><text x="1050" y="289" fill="#DC2626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Gaussian noise</text><text x="1050" y="118" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle">t = 1</text><text x="590" y="365" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Forward noising: q_t gradually destroys structure</text><text x="590" y="390" fill="#DC2626" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Reverse generation learns a vector field or score that transports p_1 back to p_0</text></svg>