<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" version="1.1"><rect width="1180" height="400" fill="#FFFFFF" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" /></marker></defs><text x="590" y="34" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Why Straight Flows Can Use Fewer Inference Steps</text><text x="590" y="59" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">The same endpoint distributions can be connected by different numerical trajectories</text><text x="35" y="106" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start">Diffusion sampler</text><text x="35" y="129" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Many stochastic denoising steps</text><circle cx="270.0" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="288.0" y1="100" x2="325.6363636363636" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="343.6363636363636" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="361.6363636363636" y1="100" x2="399.27272727272725" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="417.27272727272725" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="435.27272727272725" y1="100" x2="472.9090909090909" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="490.9090909090909" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="508.9090909090909" y1="100" x2="546.5454545454545" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="564.5454545454545" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="582.5454545454545" y1="100" x2="620.1818181818182" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="638.1818181818182" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="656.1818181818182" y1="100" x2="693.8181818181818" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="711.8181818181818" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="729.8181818181818" y1="100" x2="767.4545454545455" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="785.4545454545455" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="803.4545454545455" y1="100" x2="841.0909090909091" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="859.0909090909091" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="877.0909090909091" y1="100" x2="914.7272727272727" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="932.7272727272727" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="950.7272727272727" y1="100" x2="988.3636363636364" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="1006.3636363636364" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><line x1="1024.3636363636365" y1="100" x2="1062.0" y2="100" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)" /><circle cx="1080.0" cy="100" r="9" fill="#2563EB" opacity="0.2" stroke="#2563EB" stroke-width="2" /><text x="260" y="105" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end">noise</text><text x="1090" y="105" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start">data</text><text x="35" y="266" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start">Rectified-flow sampler</text><text x="35" y="289" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Few deterministic ODE steps</text><circle cx="270.0" cy="260" r="15" fill="#16A34A" opacity="0.2" stroke="#16A34A" stroke-width="2" /><line x1="288.0" y1="260" x2="522.0" y2="260" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)" /><circle cx="540.0" cy="260" r="15" fill="#16A34A" opacity="0.2" stroke="#16A34A" stroke-width="2" /><line x1="558.0" y1="260" x2="792.0" y2="260" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)" /><circle cx="810.0" cy="260" r="15" fill="#16A34A" opacity="0.2" stroke="#16A34A" stroke-width="2" /><line x1="828.0" y1="260" x2="1062.0" y2="260" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow)" /><circle cx="1080.0" cy="260" r="15" fill="#16A34A" opacity="0.2" stroke="#16A34A" stroke-width="2" /><text x="260" y="265" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="end">noise</text><text x="1090" y="265" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" text-anchor="start">data</text><text x="590" y="360" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Fewer steps reduce inference cost, but quality still depends on the learned vector field and solver.</text></svg>