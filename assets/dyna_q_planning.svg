family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Q(A, Left)</text><text x="1057.5" y="340.64" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">0 → 3.375</text><line x1="585" y1="298" x2="705" y2="323" stroke="#9333EA" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6" /><line x1="895" y1="323" x2="960" y2="323" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)" /><text x="600" y="430" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Planning needs no new environmental interaction: sample past experience from the model and repeat Q-learning updates.</text></svg>