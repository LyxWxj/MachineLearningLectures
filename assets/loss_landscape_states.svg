oke-width="1.3" /><text x="1017.5" y="131" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">High Plateau</text><text x="1017.5" y="152" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Very small slope; model is underfit</text><rect x="920" y="175" width="195" height="195" fill="#FFFFFF" stroke="#94A3B8" /><rect x="938" y="193" width="159" height="159" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2" /><ellipse cx="1017.5" cy="282.5" rx="27.5" ry="16.5" fill="none" stroke="#D97706" opacity="0.78" stroke-width="2" /><ellipse cx="1017.5" cy="282.5" rx="52.5" ry="31.5" fill="none" stroke="#D97706" opacity="0.78" stroke-width="2" /><ellipse cx="1017.5" cy="282.5" rx="77.5" ry="46.5" fill="none" stroke="#D97706" opacity="0.78" stroke-width="2" /><circle cx="1017.5" cy="282.5" r="5" fill="#D97706" /><line x1="941.5" y1="204.5" x2="997.5" y2="254.5" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" /><text x="1017.5" y="390" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">parameter 1</text><text x="910" y="187" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" text-anchor="end">parameter 2</text><text x="590" y="485" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Contour spacing visualizes local sensitivity: dense contours = steep loss change; sparse contours = shallow change.</text><text x="590" y="515" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Flatness is a useful heuristic, but it changes under reparameterization; validate generalization on held-out data.</text><text x="590" y="545" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anch