<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" version="1.1"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB" /></marker></defs><rect width="1200" height="510" fill="#FFFFFF" /><text x="600" y="38" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" text-anchor="middle">SARSA: the update uses the action actually taken next</text><text x="600" y="67" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Same transition: A --Left/r=0--&gt; B; exploration then selects Explore at B.</text><rect x="35" y="105" width="545" height="335" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" /><text x="307" y="143" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">SARSA (on-policy)</text><rect x="73" y="185" width="135" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" /><text x="140.5" y="217.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">A</text><text x="140.5" y="242.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Left</text><rect x="290" y="185" width="135" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" /><text x="357.5" y="230.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">B</text><line x1="208" y1="223" x2="285" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)" /><text x="247" y="201" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">r = 0</text><rect x="432" y="165" width="115" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" /><text x="489.5" y="190.95" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Forward</text><text x="489.5" y="209.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q = 4</text><rect x="432" y="248" width="115" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6" /><text x="489.5" y="273.95" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Explore</text><text x="489.5" y="292.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Q = 1</text><line x1="425" y1="253" x2="430" y2="278" stroke="#16A34A" stroke-width="3" marker-end="url(#arrow)" /><text x="307" y="343" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Actual action: Q(B, Explore) = 1</text><text x="307" y="380" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Target = 0.9</text><text x="307" y="407" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Q(A, Left): 2 → 1.45</text><rect x="620" y="105" width="545" height="335" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="2" /><text x="892" y="143" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Q-learning (off-policy)</text><rect x="658" y="185" width="135" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.6" /><text x="725.5" y="217.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">A</text><text x="725.5" y="242.6" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Left</text><rect x="875" y="185" width="135" height="76" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6" /><text x="942.5" y="230.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">B</text><line x1="793" y1="223" x2="870" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)" /><text x="832" y="201" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">r = 0</text><rect x="1017" y="165" width="115" height="60" rx="10" fill="#FDE68A" stroke="#D97706" stroke-width="1.6" /><text x="1074.5" y="190.95" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Forward</text><text x="1074.5" y="209.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Q = 4</text><rect x="1017" y="248" width="115" height="60" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" /><text x="1074.5" y="273.95" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Explore</text><text x="1074.5" y="292.7" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Q = 1</text><line x1="1010" y1="215" x2="1015" y2="195" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="7 6" /><text x="892" y="343" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Greedy action: max Q(B, ·) = 4</text><text x="892" y="380" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Target = 3.6</text><text x="892" y="407" fill="#D97706" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Q(A, Left): 2 → 2.8</text><text x="600" y="480" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">SARSA evaluates the current policy as executed; Q-learning evaluates greedy behavior from the next step onward.</text></svg>