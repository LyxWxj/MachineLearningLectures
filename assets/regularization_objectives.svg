<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" version="1.1"><rect width="1000" height="455" fill="#FFFFFF" /><text x="500" y="34" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Regularization and Optimization: Three Training Goals</text><text x="500" y="58" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle">Generalize, reach that solution efficiently, and keep updates stable</text><rect x="35" y="100" width="286" height="175" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" /><circle cx="79" cy="143" r="23" fill="#2563EB" /><text x="79" y="150" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">1</text><text x="117" y="143" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Generalization</text><text x="57" y="191" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Find a solution that works on unseen data</text><path d="M 60 242 C 110 205, 163 238, 215 217 S 275 221, 297 205" fill="none" stroke="#2563EB" stroke-width="3" /><rect x="357" y="100" width="286" height="175" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" /><circle cx="401" cy="143" r="23" fill="#D97706" /><text x="401" y="150" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">2</text><text x="439" y="143" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Efficiency</text><text x="379" y="191" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Reach similar test performance with fewer updates</text><path d="M 382 240 C 437 238, 470 218, 507 205 S 579 194, 619 190" fill="none" stroke="#D97706" stroke-width="3" /><path d="M 382 240 C 462 239, 517 230, 567 218 S 597 213, 619 211" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 4" /><rect x="679" y="100" width="286" height="175" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3" /><circle cx="723" cy="143" r="23" fill="#16A34A" /><text x="723" y="150" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">3</text><text x="761" y="143" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Stability</text><text x="701" y="191" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Make loss decrease reliably during training</text><path d="M 704 240 L 747 215 L 783 229 L 819 199 L 859 211 L 900 186 L 941 181" fill="none" stroke="#16A34A" stroke-width="3" /><line x1="95" y1="337" x2="905" y2="337" stroke="#CBD5E1" stroke-width="1.5" /><text x="500" y="377" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Regularization selects among fitting solutions; optimization controls the path used to reach them.</text><text x="500" y="408" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Neither training accuracy nor a single loss value is sufficient evidence of generalization.</text></svg>